; PlatformIO Project Configuration File for ESP32-S3 Drone Swarm Firmware
;
; Bare-metal C++ Drone Swarm Architecture
; Target: ESP32-S3 (esp32-s3-devkitc-1)
; Native Testing: env:native (Host PC unit tests without hardware dependencies)

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -O2
build_src_filter = 
    +<*>
    -<.git/>

[env:esp32-s3-test-claim]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -DTEST_CLAIM_YIELD=1
    -O2
build_src_filter = 
    +<*>
    -<.git/>

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = 
    -std=c++17
    -DNATIVE_BUILD
    -DUNIT_TEST
    -O2
build_src_filter = 
    +<state_machine.cpp>
    +<swarm_comm.cpp>
    -<.git/>
    -<main.cpp>
    -<vision.cpp>
